name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Verify app bundle
        run: |
          test -f .build/Occam.app/Contents/MacOS/Occam
          file .build/Occam.app/Contents/MacOS/Occam

      - name: Screenshot test
        run: |
          mkdir -p /tmp/screenshot-test
          .build/Occam.app/Contents/MacOS/Occam --screenshot /tmp/screenshot-test/screenshot.png

      - name: Compare screenshot against reference
        run: |
          if [ -f assets/screenshot.png ]; then
            brew install imagemagick
            RMSE=$(compare -metric RMSE assets/screenshot.png /tmp/screenshot-test/screenshot.png /tmp/screenshot-test/diff.png 2>&1 | grep -oE '^[0-9.]+' || echo "0")
            echo "RMSE: $RMSE"
            # Threshold: allow minor rendering differences between machines
            if [ "$(echo "$RMSE > 1000" | bc)" -eq 1 ]; then
              echo "Screenshot regression detected (RMSE=$RMSE > 1000)"
              echo "Run 'make screenshot' locally and commit the updated assets/screenshot.png"
              exit 1
            fi
          else
            echo "No reference screenshot found — skipping comparison"
            cp /tmp/screenshot-test/screenshot.png assets/screenshot.png
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: /tmp/screenshot-test/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" Resources/Info.plist

      - name: Build universal binary
        run: make build-universal

      - name: Verify universal binary
        run: file .build/Occam.app/Contents/MacOS/Occam

      - name: Create release zip
        run: make release-universal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Occam v${{ steps.version.outputs.version }}
          body: |
            ## Installation

            1. Download `Occam-${{ steps.version.outputs.version }}-universal.zip` below
            2. Unzip and drag `Occam.app` to your Applications folder
            3. Launch Occam — if macOS blocks it, right-click > Open (one-time only)
            4. Press **Cmd+Space** to start searching

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          files: |
            .build/Occam-${{ steps.version.outputs.version }}-universal.zip
          draft: false
          prerelease: false
