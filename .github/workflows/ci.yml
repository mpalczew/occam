name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Verify app bundle
        run: |
          test -f .build/Occam.app/Contents/MacOS/Occam
          file .build/Occam.app/Contents/MacOS/Occam

      - name: Screenshot test
        run: |
          mkdir -p /tmp/screenshot-test
          .build/Occam.app/Contents/MacOS/Occam --screenshot /tmp/screenshot-test/screenshot.png

      - name: Compare screenshot against reference
        run: |
          if [ -f assets/screenshot.png ]; then
            brew install imagemagick
            RMSE=$(compare -metric RMSE assets/screenshot.png /tmp/screenshot-test/screenshot.png /tmp/screenshot-test/diff.png 2>&1 | grep -oE '^[0-9.]+' || echo "0")
            echo "RMSE: $RMSE"
            # Threshold: allow minor rendering differences between machines
            if [ "$(echo "$RMSE > 1000" | bc)" -eq 1 ]; then
              echo "Screenshot regression detected (RMSE=$RMSE > 1000)"
              echo "Run 'make screenshot' locally and commit the updated assets/screenshot.png"
              exit 1
            fi
          else
            echo "No reference screenshot found — skipping comparison"
            mkdir -p assets
            cp /tmp/screenshot-test/screenshot.png assets/screenshot.png
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: /tmp/screenshot-test/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" Resources/Info.plist

      - name: Build universal binary
        run: make build-universal

      - name: Verify universal binary
        run: file .build/Occam.app/Contents/MacOS/Occam

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm /tmp/certificate.p12

      - name: Sign app bundle
        run: make sign

      - name: Notarize and staple
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent .build/Occam.app .build/Occam-notarize.zip
          xcrun notarytool submit .build/Occam-notarize.zip \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --wait
          rm -f .build/Occam-notarize.zip
          xcrun stapler staple .build/Occam.app

      - name: Verify signature
        run: |
          codesign --verify --verbose=2 .build/Occam.app
          spctl --assess --type exec --verbose=2 .build/Occam.app

      - name: Create release zip
        run: cd .build && zip -r -y Occam-${{ steps.version.outputs.version }}-universal.zip Occam.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Occam v${{ steps.version.outputs.version }}
          body: |
            ## Installation

            1. Download `Occam-${{ steps.version.outputs.version }}-universal.zip` below
            2. Unzip and drag `Occam.app` to your Applications folder
            3. Launch Occam
            4. Press **Cmd+Space** to start searching

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          files: |
            .build/Occam-${{ steps.version.outputs.version }}-universal.zip
          draft: false
          prerelease: false

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256=$(shasum -a 256 .build/Occam-${{ steps.version.outputs.version }}-universal.zip | awk '{print $1}')
          VERSION=${{ steps.version.outputs.version }}
          git clone https://x-access-token:${GH_TOKEN}@github.com/mpalczew/homebrew-occam.git /tmp/homebrew-occam
          cd /tmp/homebrew-occam
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/occam.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/occam.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/occam.rb
          git commit -m "Update cask to v${VERSION}"
          git push origin main
