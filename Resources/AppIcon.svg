<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="40%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="40" y="40" width="944" height="944" rx="190" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Razor blade - a clean diagonal slash -->
  <!-- Main blade body -->
  <path d="M 280 180 L 744 820 L 720 844 L 256 204 Z" fill="url(#blade)" opacity="0.95"/>

  <!-- Sharp leading edge highlight -->
  <path d="M 280 180 L 744 820 L 738 828 L 274 188 Z" fill="url(#edge)" opacity="0.9"/>

  <!-- Subtle blade spine -->
  <path d="M 268 192 L 256 204 L 720 844 L 732 832 Z" fill="#888" opacity="0.3"/>

  <!-- Small notch/detail near the top of the blade -->
  <circle cx="300" cy="220" r="6" fill="#1a1a2e" opacity="0.6"/>

  <!-- Thin accent line parallel to blade -->
  <line x1="320" y1="260" x2="700" y2="740" stroke="#4fc3f7" stroke-width="1.5" opacity="0.3"/>
</svg>
